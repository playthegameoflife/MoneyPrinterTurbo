# RunPod config — disables Redis queue, uses InMemoryTaskManager
# Copy secrets from your main config.toml (api_key, pexels_api_keys, etc.)
# DO NOT commit this file with real secrets — use environment variables in RunPod dashboard

log_level = "WARNING"
listen_host = "0.0.0.0"
listen_port = 8080

